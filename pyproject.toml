[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "transcriptqc"
version = "0.1.0"
description = "Is this transcript aligned with the current MANE reference set? MANE Select / MANE Plus Clinical check for RefSeq and Ensembl transcripts, offline, from a versioned MANE snapshot."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["MANE", "RefSeq", "Ensembl", "transcript", "clinical genomics", "HGVS", "QC"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License", "Intended Audience :: Science/Research", "Topic :: Scientific/Engineering :: Bio-Informatics"]
authors = [{name = "Margarita Solosenko"}]
dependencies = ["typer>=0.12"]
[project.urls]
Homepage = "https://github.com/MargoSolo/transcriptQC"
Changelog = "https://github.com/MargoSolo/transcriptQC/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]
[project.scripts]
manecheck = "transcriptqc.cli:app"
transcriptqc = "transcriptqc.cli:app"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
transcriptqc = ["data/*.gz"]
